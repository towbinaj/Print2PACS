name: CI

# Runs on every push and pull request (all branches), so the suite is exercised
# on every commit — not only on release-marked commits (that is release.yml).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # windows-latest matches the deployment target and the release build env,
    # where the full dependency set (incl. the GUI libs) installs cleanly.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: '3.14'
      - name: Bandit (advisory)
        # Advisory: report Python security findings without failing the build.
        run: |
          pip install bandit
          bandit -r print2pacs -q -ll || true
